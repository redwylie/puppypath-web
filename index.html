<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <!--
    coi-serviceworker registers a service worker that rewrites response
    headers so the page becomes cross-origin isolated (`crossOriginIsolated
    === true`), which unlocks `SharedArrayBuffer` and OPFS storage for the
    Drift Wasm database. Without this, Drift falls back to IndexedDB-backed
    storage tiers which have a known silent-hang bug on writes to certain
    tables (specifically `practice_behaviors`, with its enum-converter
    columns). See memory/project_drift_wasm_batch_hang.md for the full
    investigation log.

    Why this matters for PWA hosting on GitHub Pages: GH Pages cannot set
    `Cross-Origin-Opener-Policy` / `Cross-Origin-Embedder-Policy` headers
    natively. coi-serviceworker is a JS shim that emulates them via a
    service worker, so we get cross-origin isolation without changing
    hosts. On first load the SW installs and forces a page reload; from
    then on the page boots already isolated.

    Must load BEFORE flutter_bootstrap.js so the SW is registered before
    Flutter mounts. Default config uses `credentialless` COEP — see the
    YouTube iframe at lib/features/train/widgets/course_youtube_iframe_web.dart
    for the matching iframe attribute.
  -->
  <script src="coi-serviceworker.min.js"></script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Week-by-week puppy training tracker — Plan, 100 Experiences, Tips, and the MSPCA Level 1 course homework in one app.">

  <!-- Theme color — matches manifest.json. Browsers use this to tint the
       OS chrome (Android status bar, Safari tab color, install prompt
       backdrop). Keep in lockstep with web/manifest.json:theme_color. -->
  <meta name="theme-color" content="#0061A4">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Puppy Path">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Puppy Path</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0061A4;
      background-image: url("splash/img/light-background.png");
      /* cover (not "100% 100%") so the image fills the viewport without
         distortion. Crop is preferred over stretch since the splash
         portrait runs at a fixed aspect ratio. Re-applied after every
         flutter_native_splash:create regen — the plugin overwrites this
         block. */
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1A1A1A;
        background-image: url("splash/img/dark-background.png");
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
